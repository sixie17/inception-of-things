apiVersion: apps/v1
kind: Deployment
metadata:
  name: smokeybull-app
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smokeybull-app
  template: 
    metadata:
      labels:
        app: smokeybull-app
    spec:
      containers:
      - name: app-container
        image: sixiecow/inception-of-things:v2
        ports:
        - containerPort: 3000
